  - id: cpp-parse
    title: C++ · parse integer safely
    language: cpp
    body: |-
      #include <charconv>
      #include <expected>
      #include <string_view>
      #include <system_error>

      std::expected<int, std::errc> parse_int(std::string_view text) {
          if (text.empty())
              return std::unexpected(std::errc::invalid_argument);
          int value = 0;
          const auto [end, error] = std::from_chars(text.data(), text.data() + text.size(), value);
          if (error != std::errc{})
              return std::unexpected(error);
          if (end != text.data() + text.size())
              return std::unexpected(std::errc::invalid_argument);
          return value;
      }
  - id: cpp-frequency
    title: C++ · count element frequency
    language: cpp
    body: |-
      #include <span>
      #include <unordered_map>

      std::unordered_map<int, std::size_t> frequencies(std::span<const int> values) {
          std::unordered_map<int, std::size_t> counts;
          for (const int value : values)
              ++counts[value];
          return counts;
      }
  - id: cpp-erase
    title: C++ · remove matching elements
    language: cpp
    body: |-
      #include <vector>

      int main() {
          std::vector<int> values{1, 2, 3, 4, 5};
          std::erase_if(values, [](int value) { return value % 2 == 0; });
      }
  - id: cpp-time
    title: C++ · measure elapsed time
    language: cpp
    body: |-
      #include <chrono>
      #include <iostream>

      int main() {
          const auto start = std::chrono::steady_clock::now();
          // Run the work to measure here.
          const auto elapsed = std::chrono::steady_clock::now() - start;
          std::cout << std::chrono::duration<double, std::milli>(elapsed).count() << " ms\n";
      }
  - id: cpp-file
    title: C++ · read entire text file
    language: cpp
    body: |-
      #include <fstream>
      #include <iterator>
      #include <optional>
      #include <string>

      std::optional<std::string> read_file(const std::string& path) {
          std::ifstream input{path, std::ios::binary};
          if (!input)
              return std::nullopt;
          std::string text{std::istreambuf_iterator<char>{input}, std::istreambuf_iterator<char>{}};
          if (input.bad())
              return std::nullopt;
          return text;
      }
  - id: python-json
    title: Python · read and write JSON
    language: python
    body: |-
      import json
      from pathlib import Path

      path = Path("data.json")
      data = json.loads(path.read_text(encoding="utf-8"))
      Path("output.json").write_text(
          json.dumps(data, indent=2, ensure_ascii=False) + "\n",
          encoding="utf-8",
      )
  - id: python-cli
    title: Python · simple CLI arguments
    language: python
    body: |-
      import argparse
      from pathlib import Path

      parser = argparse.ArgumentParser(description="Process a file")
      parser.add_argument("file", type=Path)
      parser.add_argument("--verbose", action="store_true")
      args = parser.parse_args()
      print(args.file.read_text(encoding="utf-8"))
  - id: ts-fetch
    title: TypeScript · fetch JSON
    language: typescript
    body: |-
      async function fetchJson(url: string): Promise<unknown> {
          const response = await fetch(url);
          if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
      }
  - id: ts-debounce
    title: TypeScript · debounce callback
    language: typescript
    body: |-
      function debounce<Args extends unknown[]>(callback: (...args: Args) => void, delayMs = 200) {
          let timer: ReturnType<typeof setTimeout> | undefined;
          return (...args: Args) => {
              clearTimeout(timer);
              timer = setTimeout(() => callback(...args), delayMs);
          };
      }
  - id: go-json
    title: Go · decode JSON file
    language: go
    body: |-
      package main

      import (
          "encoding/json"
          "fmt"
          "log"
          "os"
      )

      func main() {
          file, err := os.Open("data.json")
          if err != nil {
              log.Fatal(err)
          }
          defer file.Close()

          var data map[string]any
          if err := json.NewDecoder(file).Decode(&data); err != nil {
              log.Fatal(err)
          }
          fmt.Println(data)
      }
