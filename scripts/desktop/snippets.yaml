  - id: cpp-binary
    title: C++ · binary search index
    language: cpp
    body: |-
      #include <cstddef>
      #include <optional>
      #include <span>

      // Input must be sorted in ascending order.
      std::optional<std::size_t> binary_search_index(std::span<const int> values, int target) {
          std::size_t first = 0;
          std::size_t last = values.size();
          while (first < last) {
              const auto middle = first + (last - first) / 2;
              if (values[middle] < target)
                  first = middle + 1;
              else
                  last = middle;
          }
          if (first < values.size() && values[first] == target)
              return first;
          return std::nullopt;
      }
  - id: cpp-lower
    title: C++ · standard binary search
    language: cpp
    body: |-
      #include <algorithm>
      #include <vector>

      std::vector<int> values{1, 3, 5, 7};
      const int target = 5;
      const auto found = std::lower_bound(values.begin(), values.end(), target);
      const bool exists = found != values.end() && *found == target;
  - id: cpp-unique
    title: C++ · sort and remove duplicates
    language: cpp
    body: |-
      #include <algorithm>
      #include <vector>

      std::vector<int> values{3, 1, 3, 2};
      std::ranges::sort(values);
      const auto duplicates = std::ranges::unique(values);
      values.erase(duplicates.begin(), duplicates.end());
  - id: cpp-lines
    title: C++ · read file line by line
    language: cpp
    body: |-
      #include <fstream>
      #include <iostream>
      #include <string>

      int main() {
          std::ifstream input{"input.txt"};
          if (!input) {
              std::cerr << "Cannot open input.txt\n";
              return 1;
          }
          for (std::string line; std::getline(input, line);)
              std::cout << line << '\n';
          return input.bad() ? 1 : 0;
      }
