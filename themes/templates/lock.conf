# Generated from themes/mono.yaml. Do not edit.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb({{colors.background}})
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    outer_color = rgb({{colors.border}})
    inner_color = rgb({{colors.surface}})
    font_color = rgb({{colors.foreground}})
    font_family = {{fonts.family}}
    rounding = {{geometry.radius}}
    placeholder_text = Password
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
