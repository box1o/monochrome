# Generated from themes/mono.yaml. Do not edit.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style 'fg=#{{colors.foreground}},bg=#{{colors.background}}'
set -g status-left-length 0
set -g status-right-length 80
set -g status-left ''
set -g status-right '#[fg=#{{colors.foreground}}]#S #[fg=#{{colors.muted}}]%H:%M'
set -g message-style 'fg=#{{colors.foreground}},bg=#{{colors.surface}}'
set -g message-command-style 'fg=#{{colors.foreground}},bg=#{{colors.surface}}'
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-style 'fg=#{{colors.border}}'
set -g pane-active-border-style 'fg=#{{colors.accent}}'
set -g window-status-separator ''
set -g window-status-format '#[fg=#{{colors.muted}},bg=#{{colors.background}}]#I:#W'
set -g window-status-current-format '#[fg=#{{colors.foreground}},bg=#{{colors.surface}},bold]#I:#W'
set -w -g clock-mode-colour '#{{colors.accent}}'
set -g mode-style 'fg=#{{colors.on_accent}},bg=#{{colors.accent}},bold'
