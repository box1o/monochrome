$background = rgba(181616ff)
$surface = rgba(2d2a2eff)
$accent = rgba(c4746eff)

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = $accent
    col.inactive_border = $surface
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 4
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000055)
    }
    blur {
        enabled = true
        size = 4
        passes = 1
        vibrancy = 0.08
    }
}

animations {
    enabled = true
    bezier = mono, 0.2, 0.9, 0.2, 1.0
    animation = windows, 1, 1.6, mono
    animation = windowsOut, 1, 1.4, mono, popin 90%
    animation = fade, 1, 1.4, mono
    animation = workspaces, 1, 1.6, mono
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
