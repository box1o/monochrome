# Terminal and input.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB'
set -g mouse on
set -g set-clipboard on
set -s escape-time 0

# Prefix and pane navigation.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits keep the working directory.
unbind %
bind | split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

bind R source-file "$HOME/.config/tmux/tmux.conf" \; display-message 'tmux.conf reloaded'
bind r command-prompt -I '#W' "rename-window '%%'"
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off

# Native format conditions avoid a shell and grep on every navigation key.
bind -n M-h if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -w -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

source-file "$HOME/.config/tmux/theme.conf"

# Optional persistence plugins; missing plugins do not break a fresh install.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore on
set -g @continuum-save-interval 10
set -g @continuum-boot on
set -g @resurrect-strategy-nvim session
set -g @resurrect-processes 'ssh nvim vim zsh bash fish'
set -g @resurrect-capture-pane-contents on
bind S if-shell 'test -x "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"' 'run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"'
bind P if-shell 'test -x "$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh"' 'run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh"'
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
