# Keep high-quality Bluetooth playback while applications use a separate microphone.
wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}

# Give PCI-connected laptop microphones an identifiable name in application lists.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_input.pci-.*" } ]
        actions = {
            update-props = {
                node.description = "Built-in Microphone"
                node.nick = "Built-in Microphone"
            }
        }
    }
]
