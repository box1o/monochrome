    target: .config/gtk-3.0/settings.ini
  gtk3-style:
    source: generated/gtk-3.0/gtk.css
    target: .config/gtk-3.0/gtk.css
  gtk4:
    source: generated/gtk-4.0/settings.ini
    target: .config/gtk-4.0/settings.ini
